<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f1a">
<title>RUNLOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0f1a;
    --surface: #121a2b;
    --surface-2: #182338;
    --line: #24304a;
    --ink: #e8edf7;
    --ink-dim: #8b97b3;
    --ink-faint: #5a6685;
    --pulse: #ff5d5d;
    --trace: #56e0c2;
    --pace: #f2c94c;
    --amber: #f2994a;
    --font-display: 'Zen Kaku Gothic New', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-display); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; }
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(86,224,194,0.07), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(255,93,93,0.06), transparent 40%);
  }

  /* ---------- App shell ---------- */
  .app-shell{
    max-width:480px; margin:0 auto;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .topbar{
    flex:0 0 auto;
    padding:16px 18px 12px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  .topbar .brand{ font-family:var(--font-mono); font-weight:800; font-size:18px; letter-spacing:1.5px; }
  .topbar .brand span{ color:var(--trace); }
  .topbar .screen-title{ font-size:11px; color:var(--ink-dim); letter-spacing:1px; }

  .screens{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .screen{ display:none; padding:16px 16px calc(24px + var(--safe-bottom)); }
  .screen.active{ display:block; }

  .tabbar{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--surface);
    padding-bottom:var(--safe-bottom);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 4px 8px; background:none; border:none; color:var(--ink-faint);
    font-family:var(--font-display); font-size:10px; letter-spacing:0.5px; cursor:pointer;
  }
  .tab svg{ width:20px; height:20px; }
  .tab.active{ color:var(--trace); }
  .tab.active svg{ filter:drop-shadow(0 0 6px rgba(86,224,194,0.5)); }

  /* ---------- Watch face summary ---------- */
  .watch{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--line); border-radius:20px; padding:20px 16px; position:relative; overflow:hidden;
  }
  .watch::before{ content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 24px); pointer-events:none; }
  .watch-row{ display:flex; justify-content:space-between; gap:6px; position:relative; }
  .stat{ flex:1; text-align:center; min-width:0; }
  .stat-label{ font-size:9.5px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; white-space:nowrap; }
  .stat-value{ font-family:var(--font-mono); font-weight:700; font-size:19px; font-variant-numeric: tabular-nums; }
  .stat-value small{ font-size:11px; font-weight:500; color:var(--ink-dim); margin-left:1px;}
  .stat.dist .stat-value{ color:var(--trace); text-shadow:0 0 18px rgba(86,224,194,0.35); }
  .stat.pace .stat-value{ color:var(--pace); text-shadow:0 0 18px rgba(242,201,76,0.3); }
  .stat.hr .stat-value{ color:var(--pulse); text-shadow:0 0 18px rgba(255,93,93,0.35); }
  .stat-divider{ width:1px; background:var(--line); margin:2px 0; }
  .watch-foot{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:11px; color:var(--ink-dim); text-align:center; }
  .watch-sub{
    margin-top:12px; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; position:relative;
  }
  .mini{ text-align:center; }
  .mini .v{ font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--ink); }
  .mini .l{ font-size:8.5px; color:var(--ink-faint); letter-spacing:0.5px; margin-top:2px; }

  /* ---------- Panels / cards ---------- */
  .panel{ margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .panel-title{ font-size:13px; font-weight:700; letter-spacing:0.5px; display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--ink); }
  .panel-title .dot{ width:6px; height:6px; border-radius:50%; background:var(--trace); }

  .dropzone{ position:relative; border:1.5px dashed var(--line); border-radius:14px; padding:26px 16px; text-align:center; transition:border-color .2s, background .2s; }
  .dropzone:hover, .dropzone.drag{ border-color:var(--trace); background:rgba(86,224,194,0.04); }
  .dropzone{ cursor:pointer; -webkit-tap-highlight-color: rgba(86,224,194,0.15); }
  .dropzone input{
    position:absolute; width:1px; height:1px; opacity:0;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%);
  }
  .dz-content{ position:relative; pointer-events:none; }
  .dz-icon{ width:44px; height:44px; margin:0 auto 12px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-dim); }
  .dz-text{ font-size:13px; color:var(--ink); font-weight:500; }
  .dz-sub{ font-size:11px; color:var(--ink-dim); margin-top:4px; }

  .preview-wrap{ position:relative; border-radius:14px; overflow:hidden; }
  .preview-wrap img{ width:100%; display:block; max-height:min(70vh, 720px); height:auto; object-fit:contain; background:#05070d; }
  .preview-wrap .clear-btn{ position:absolute; top:8px; right:8px; background:rgba(10,15,26,0.75); color:var(--ink); border:1px solid var(--line); border-radius:8px; font-size:11px; padding:5px 9px; cursor:pointer; }
  .scan-overlay{ position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--trace), transparent); animation: scan 1.6s linear infinite; box-shadow:0 0 12px var(--trace); }
  @keyframes scan{ 0%{ top:0; } 100%{ top:100%; } }
  .analyzing-tag{ margin-top:10px; font-size:12px; color:var(--trace); font-family:var(--font-mono); display:flex; align-items:center; gap:8px; }
  .spinner{ width:12px; height:12px; border-radius:50%; border:2px solid rgba(86,224,194,0.25); border-top-color:var(--trace); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-tag{ margin-top:10px; font-size:12px; color:var(--pulse); background:rgba(255,93,93,0.08); border:1px solid rgba(255,93,93,0.25); padding:8px 10px; border-radius:8px; }
  .preview-note{ margin-top:7px; font-size:10px; color:var(--ink-dim); text-align:center; }

  .confirm{ margin-top:14px; display:none; }
  .confirm.show{ display:block; }
  .confirm-note{ font-size:11px; color:var(--ink-dim); margin-bottom:12px; line-height:1.5; }
  .field-row{ display:flex; gap:10px; margin-bottom:10px; }
  .field{ flex:1; min-width:0; }
  .field label{ display:block; font-size:10px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; }
  .field input, .field textarea{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:9px 10px; font-family:var(--font-mono); font-size:14px; }
  .field textarea{ font-family:var(--font-display); font-size:13px; resize:vertical; min-height:44px; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--trace); }
  .field.dist input{ color:var(--trace); } .field.pace input{ color:var(--pace); } .field.hr input{ color:var(--pulse); }

  .more-toggle{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 2px; margin-top:2px; cursor:pointer; color:var(--ink-dim); font-size:12px;
  }
  .more-toggle .chev{ transition:transform .2s; }
  .more-toggle.open .chev{ transform:rotate(180deg); }
  .more-fields{ display:none; }
  .more-fields.show{ display:block; }

  .btn{ width:100%; padding:12px; border-radius:11px; border:none; font-family:var(--font-display); font-weight:700; font-size:14px; cursor:pointer; letter-spacing:0.5px; }
  .btn-primary{ background:linear-gradient(180deg, #62e8ca, #45c7ab); color:#052620; margin-top:10px; }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-ghost{ background:transparent; color:var(--ink-dim); border:1px solid var(--line); margin-top:8px; font-weight:500; }

  /* ---------- History ---------- */
  .history-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; padding:0 2px; }
  .history-head h2{ font-size:13px; letter-spacing:1px; margin:0; color:var(--ink); }
  .history-count{ font-size:11px; color:var(--ink-dim); font-family:var(--font-mono); }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-dim); border:1px dashed var(--line); border-radius:14px; font-size:12px; line-height:1.7; }

  .entry{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .entry-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .entry-date{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); letter-spacing:0.5px; }
  .entry-del{ background:none; border:none; color:var(--ink-dim); font-size:16px; cursor:pointer; padding:2px 6px; line-height:1; }
  .entry-del:hover{ color:var(--pulse); }
  .entry-stats{ display:flex; gap:0; }
  .entry-stat{ flex:1; text-align:center; }
  .entry-stat .v{ font-family:var(--font-mono); font-weight:700; font-size:15px; font-variant-numeric: tabular-nums; }
  .entry-stat .l{ font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-top:2px; }
  .entry-stat.dist .v{ color:var(--trace); } .entry-stat.pace .v{ color:var(--pace); } .entry-stat.hr .v{ color:var(--pulse); } .entry-stat.dur .v{ color:var(--amber); }
  .entry-extra{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); display:flex; flex-wrap:wrap; gap:8px; }
  .entry-memo{ margin-top:8px; font-size:12px; color:var(--ink-dim); line-height:1.5; }

  /* ---------- Monthly ---------- */
  .month-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden; }
  .month-head{ padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .month-title{ font-weight:700; font-size:14px; }
  .month-count{ font-size:11px; color:var(--ink-dim); font-family:var(--font-mono); margin-top:2px; }
  .month-chev{ color:var(--ink-faint); transition:transform .2s; }
  .month-chev.open{ transform:rotate(180deg); }
  .month-stats{ display:flex; padding:0 16px 14px; gap:0; }
  .month-detail{ display:none; padding:0 12px 14px; border-top:1px solid var(--line); }
  .month-detail.show{ display:block; padding-top:12px; }
  .month-extra{ display:flex; flex-wrap:wrap; gap:8px 14px; padding:0 4px 14px; font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); }

  ::selection{ background:rgba(86,224,194,0.3); }
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<meta name="runlog-ocr-build" content="2026-08-23-v9-spatial">

<body>
<div class="app-shell">

  <div class="topbar">
    <div>
      <div class="brand">RUN<span>LOG</span></div>
      <div class="screen-title" id="screenTitle">ホーム</div>
    </div>
  </div>

  <div class="screens">

    <!-- ===== HOME SCREEN ===== -->
    <div class="screen active" id="screen-home">
      <div class="watch">
        <div class="watch-row">
          <div class="stat dist"><div class="stat-label">総距離</div><div class="stat-value" id="sumDistance">0.0<small>km</small></div></div>
          <div class="stat-divider"></div>
          <div class="stat pace"><div class="stat-label">平均ペース</div><div class="stat-value" id="sumPace">--<small>/km</small></div></div>
          <div class="stat-divider"></div>
          <div class="stat hr"><div class="stat-label">平均心拍数</div><div class="stat-value" id="sumHr">--<small>bpm</small></div></div>
        </div>
        <div class="watch-sub">
          <div class="mini"><div class="v" id="sumCalories">--</div><div class="l">総KCAL</div></div>
          <div class="mini"><div class="v" id="sumSteps">--</div><div class="l">総歩数</div></div>
          <div class="mini"><div class="v" id="sumElevation">--</div><div class="l">総獲得標高</div></div>
          <div class="mini"><div class="v" id="sumRuns">0</div><div class="l">総ラン数</div></div>
        </div>
        <div class="watch-foot" id="watchFoot">まだ記録がありません</div>
      </div>

      <div class="panel">
        <div class="panel-title"><span class="dot"></span>画像から記録を読み取る</div>

        <label id="dropzone" class="dropzone" for="fileInput">
          <input type="file" id="fileInput" accept="image/*" aria-label="画像を選択">
          <div class="dz-content">
            <div class="dz-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M4 16l4.5-6 3.5 4.5 2.5-3L20 16"/><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="8.5" r="1.3"/>
              </svg>
            </div>
            <div class="dz-text">タップして画像を選択</div>
            <div class="dz-sub">またはここに画像を貼り付け (Ctrl/Cmd+V)</div>
          </div>
        </label>

        <div id="previewArea" style="display:none;">
          <div class="preview-wrap">
            <img id="previewImg" src="" alt="preview">
            <div id="scanLine" class="scan-overlay" style="display:none;"></div>
            <button class="clear-btn" id="clearBtn">✕ やり直す</button>
          </div>
          <div class="preview-note">アップロードした画像は、切り取らずに全体を表示しています。</div>
          <div id="analyzingTag" class="analyzing-tag" style="display:none;"><div class="spinner"></div> 画像を解析しています…</div>
          <div id="errorTag" class="error-tag" style="display:none;"></div>
        </div>

        <div class="confirm" id="confirmBlock">
          <div class="confirm-note">読み取った内容を確認・修正してから記録してください。</div>
          <div class="field-row">
            <div class="field dist"><label>距離 (km)</label><input type="number" step="0.01" id="inDistance" placeholder="例: 4.93"></div>
            <div class="field pace"><label>平均ペース (/km)</label><input type="text" id="inPace" placeholder="例: 7'34&quot;"></div>
          </div>
          <div class="field-row">
            <div class="field hr"><label>平均心拍数 (bpm)</label><input type="number" id="inHr" placeholder="例: 147"></div>
            <div class="field"><label>時間 (mm:ss)</label><input type="text" id="inDuration" placeholder="例: 37:22"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>日付</label><input type="date" id="inDate"></div>
          </div>

          <div class="more-toggle" id="moreToggle">
            <span>詳細データ（カロリー・歩数など）</span>
            <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="more-fields" id="moreFields">
            <div class="field-row">
              <div class="field"><label>消費カロリー (kcal)</label><input type="number" id="inCalories" placeholder="例: 391"></div>
              <div class="field"><label>歩数</label><input type="number" id="inSteps" placeholder="例: 5726"></div>
            </div>
            <div class="field-row">
              <div class="field"><label>獲得標高 (m)</label><input type="number" id="inElevation" placeholder="例: 104"></div>
              <div class="field"><label>有酸素運動負荷</label><input type="number" id="inAerobic" placeholder="例: 73"></div>
            </div>
            <div class="field-row">
              <div class="field"><label>アクティブゾーン時間 (分)</label><input type="number" id="inAzm" placeholder="例: 68"></div>
            </div>
          </div>

          <div class="field" style="margin-top:10px;"><label>メモ（任意）</label><textarea id="inMemo" placeholder="コース、天気、体調など"></textarea></div>
          <button class="btn btn-primary" id="saveBtn">この内容で記録する</button>
          <button class="btn btn-ghost" id="cancelBtn">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- ===== HISTORY SCREEN ===== -->
    <div class="screen" id="screen-history">
      <div class="history-head"><h2>記録履歴</h2><span class="history-count" id="historyCount">0 件</span></div>
      <div id="historyList"></div>
    </div>

    <!-- ===== MONTHLY SCREEN ===== -->
    <div class="screen" id="screen-monthly">
      <div class="history-head"><h2>月次集計</h2><span class="history-count" id="monthlyCount">0 ヶ月</span></div>
      <div id="monthlyList"></div>
    </div>

  </div>

  <div class="tabbar">
    <button class="tab active" data-screen="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 3l-8 9h5v9h6v-9h5z"/></svg>
      ホーム
    </button>
    <button class="tab" data-screen="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      履歴
    </button>
    <button class="tab" data-screen="monthly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      月次
    </button>
  </div>
</div>

<script>
(function(){
  // ---------- element refs ----------
  const $ = id => document.getElementById(id);
  const dropzone = $('dropzone'), fileInput = $('fileInput'), previewArea = $('previewArea'), previewImg = $('previewImg');
  const clearBtn = $('clearBtn'), scanLine = $('scanLine'), analyzingTag = $('analyzingTag'), errorTag = $('errorTag');
  const confirmBlock = $('confirmBlock');
  const ocrRetryBtn = $('ocrRetryBtn');
  const inDistance = $('inDistance'), inPace = $('inPace'), inHr = $('inHr'), inDuration = $('inDuration'), inDate = $('inDate');
  const inCalories = $('inCalories'), inSteps = $('inSteps'), inElevation = $('inElevation'), inAerobic = $('inAerobic'), inAzm = $('inAzm'), inMemo = $('inMemo');
  const saveBtn = $('saveBtn'), cancelBtn = $('cancelBtn');
  const moreToggle = $('moreToggle'), moreFields = $('moreFields');
  const historyList = $('historyList'), historyCount = $('historyCount');
  const monthlyList = $('monthlyList'), monthlyCount = $('monthlyCount');
  const sumDistance = $('sumDistance'), sumPace = $('sumPace'), sumHr = $('sumHr'), watchFoot = $('watchFoot');
  const sumCalories = $('sumCalories'), sumSteps = $('sumSteps'), sumElevation = $('sumElevation'), sumRuns = $('sumRuns');
  const screenTitle = $('screenTitle');

  const STORAGE_KEY = 'runlog:records';
  let records = [];

  // ---------- tab navigation ----------
  const titles = { home:'ホーム', history:'記録履歴', monthly:'月次集計' };
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
      tab.classList.add('active');
      $('screen-' + tab.dataset.screen).classList.add('active');
      screenTitle.textContent = titles[tab.dataset.screen];
    });
  });

  moreToggle.addEventListener('click', ()=>{
    moreToggle.classList.toggle('open');
    moreFields.classList.toggle('show');
  });

  // ---------- helpers ----------
  function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
  function fmtDate(s){ const [y,m,d]=s.split('-'); return `${y}/${m}/${d}`; }
  function ym(s){ return s ? s.slice(0,7) : ''; }
  function fmtYm(s){ const [y,m]=s.split('-'); return `${y}年${parseInt(m,10)}月`; }

  function paceToSeconds(str){
    if(!str) return null;
    const m = String(str).match(/(\d+)\s*[:'.\s]\s*(\d{1,2})/);
    if(!m) return null;
    return parseInt(m[1],10)*60 + parseInt(m[2],10);
  }
  function secondsToPace(sec){
    if(sec == null || isNaN(sec)) return '--';
    const m = Math.floor(sec/60), s = Math.round(sec%60);
    return `${m}'${String(s).padStart(2,'0')}"`;
  }
  function durationToSeconds(str){
    if(!str) return null;
    const parts = String(str).split(/[:']/).map(x=>parseInt(x,10)).filter(x=>!isNaN(x));
    if(parts.length === 0) return null;
    if(parts.length === 1) return parts[0]*60;
    if(parts.length === 2) return parts[0]*60 + parts[1];
    return parts[0]*3600 + parts[1]*60 + parts[2];
  }
  function secondsToDuration(sec){
    if(sec == null || isNaN(sec)) return '--';
    sec = Math.round(sec);
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtNum(n){ return n==null ? null : Number(n).toLocaleString('ja-JP'); }

  // ---------- storage ----------
  async function loadRecords(){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      records = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ records = []; }
    renderAll();
  }
  async function persist(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(records)); }
    catch(e){ console.error('保存に失敗しました', e); }
  }

  // ---------- aggregation ----------
  function aggregate(list){
    const totalDistance = list.reduce((s,r)=> s + (Number(r.distance)||0), 0);
    const totalDuration = list.reduce((s,r)=> s + (Number(r.durationSec)||0), 0);
    const totalCalories = list.reduce((s,r)=> s + (Number(r.calories)||0), 0);
    const totalSteps = list.reduce((s,r)=> s + (Number(r.steps)||0), 0);
    const totalElevation = list.reduce((s,r)=> s + (Number(r.elevationGain)||0), 0);
    const totalAzm = list.reduce((s,r)=> s + (Number(r.activeZoneMin)||0), 0);

    const hrs = list.map(r=>Number(r.heartRate)).filter(v=>!isNaN(v) && v>0);
    const avgHr = hrs.length ? Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length) : null;

    // weighted pace from total duration / total distance (more accurate than averaging pace strings)
    let avgPaceSec = null;
    if(totalDistance > 0 && totalDuration > 0){
      avgPaceSec = totalDuration / totalDistance;
    }else{
      const paces = list.map(r=>paceToSeconds(r.pace)).filter(v=>v!=null);
      if(paces.length) avgPaceSec = paces.reduce((a,b)=>a+b,0)/paces.length;
    }

    return { count:list.length, totalDistance, totalDuration, totalCalories, totalSteps, totalElevation, totalAzm, avgHr, avgPaceSec };
  }

  // ---------- render: home ----------
  function renderHome(){
    const agg = aggregate(records);
    sumDistance.innerHTML = `${agg.totalDistance.toFixed(1)}<small>km</small>`;
    sumPace.innerHTML = agg.avgPaceSec!=null ? `${secondsToPace(agg.avgPaceSec)}<small>/km</small>` : `--<small>/km</small>`;
    sumHr.innerHTML = agg.avgHr!=null ? `${agg.avgHr}<small>bpm</small>` : `--<small>bpm</small>`;
    sumCalories.textContent = agg.totalCalories ? fmtNum(agg.totalCalories) : '--';
    sumSteps.textContent = agg.totalSteps ? fmtNum(agg.totalSteps) : '--';
    sumElevation.textContent = agg.totalElevation ? `${fmtNum(agg.totalElevation)}m` : '--';
    sumRuns.textContent = agg.count;

    const sorted = [...records].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    watchFoot.textContent = records.length ? `直近の記録: ${fmtDate(sorted[0].date)}` : 'まだ記録がありません';
  }

  // ---------- render: entry card (shared) ----------
  function entryCardHtml(r){
    const extras = [];
    if(r.calories!=null) extras.push(`🔥 ${fmtNum(r.calories)}kcal`);
    if(r.steps!=null) extras.push(`👣 ${fmtNum(r.steps)}歩`);
    if(r.elevationGain!=null) extras.push(`⛰ +${fmtNum(r.elevationGain)}m`);
    if(r.aerobicLoad!=null) extras.push(`負荷 ${r.aerobicLoad}`);
    if(r.activeZoneMin!=null) extras.push(`AZM ${r.activeZoneMin}分`);

    return `
      <div class="entry" data-id="${r.id}">
        <div class="entry-top">
          <div class="entry-date">${fmtDate(r.date)}</div>
          <button class="entry-del" data-id="${r.id}" title="削除">✕</button>
        </div>
        <div class="entry-stats">
          <div class="entry-stat dist"><div class="v">${r.distance!=null ? Number(r.distance).toFixed(2):'--'}</div><div class="l">KM</div></div>
          <div class="entry-stat dur"><div class="v">${r.durationSec!=null ? secondsToDuration(r.durationSec) : '--'}</div><div class="l">TIME</div></div>
          <div class="entry-stat pace"><div class="v">${r.pace || '--'}</div><div class="l">/KM</div></div>
          <div class="entry-stat hr"><div class="v">${r.heartRate!=null ? r.heartRate : '--'}</div><div class="l">BPM</div></div>
        </div>
        ${extras.length ? `<div class="entry-extra">${extras.map(e=>`<span>${e}</span>`).join('')}</div>` : ''}
        ${r.memo ? `<div class="entry-memo">${escapeHtml(r.memo)}</div>` : ''}
      </div>
    `;
  }

  // ---------- render: history ----------
  function renderHistory(){
    const sorted = [...records].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.id - a.id);
    historyCount.textContent = `${records.length} 件`;
    historyList.innerHTML = records.length === 0
      ? '<div class="empty">まだ記録がありません<br>ホームタブから画像をアップロードして記録しましょう</div>'
      : sorted.map(entryCardHtml).join('');
  }

  // ---------- render: monthly ----------
  let openMonths = new Set();
  function renderMonthly(){
    const groups = {};
    records.forEach(r=>{
      const key = ym(r.date);
      if(!key) return;
      (groups[key] = groups[key] || []).push(r);
    });
    const keys = Object.keys(groups).sort().reverse();
    monthlyCount.textContent = `${keys.length} ヶ月`;

    if(keys.length === 0){
      monthlyList.innerHTML = '<div class="empty">まだ記録がありません<br>記録が増えると月ごとの集計が表示されます</div>';
      return;
    }

    monthlyList.innerHTML = keys.map(key=>{
      const list = groups[key];
      const agg = aggregate(list);
      const isOpen = openMonths.has(key);
      return `
        <div class="month-card">
          <div class="month-head" data-month="${key}">
            <div>
              <div class="month-title">${fmtYm(key)}</div>
              <div class="month-count">${agg.count} 回のラン</div>
            </div>
            <svg class="month-chev ${isOpen?'open':''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="month-stats">
            <div class="stat dist"><div class="stat-label">総距離</div><div class="stat-value" style="font-size:17px;">${agg.totalDistance.toFixed(1)}<small>km</small></div></div>
            <div class="stat pace"><div class="stat-label">平均ペース</div><div class="stat-value" style="font-size:17px;">${agg.avgPaceSec!=null?secondsToPace(agg.avgPaceSec):'--'}<small>/km</small></div></div>
            <div class="stat hr"><div class="stat-label">平均心拍数</div><div class="stat-value" style="font-size:17px;">${agg.avgHr!=null?agg.avgHr:'--'}<small>bpm</small></div></div>
          </div>
          <div class="month-extra">
            ${agg.totalDuration ? `<span>⏱ ${secondsToDuration(agg.totalDuration)}</span>`:''}
            ${agg.totalCalories ? `<span>🔥 ${fmtNum(agg.totalCalories)}kcal</span>`:''}
            ${agg.totalSteps ? `<span>👣 ${fmtNum(agg.totalSteps)}歩</span>`:''}
            ${agg.totalElevation ? `<span>⛰ +${fmtNum(agg.totalElevation)}m</span>`:''}
            ${agg.totalAzm ? `<span>AZM合計 ${agg.totalAzm}分</span>`:''}
          </div>
          <div class="month-detail ${isOpen?'show':''}" id="detail-${key}">
            ${list.sort((a,b)=> (b.date||'').localeCompare(a.date||'')).map(entryCardHtml).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderAll(){ renderHome(); renderHistory(); renderMonthly(); }

  monthlyList.addEventListener('click', (e)=>{
    const head = e.target.closest('.month-head');
    if(!head) return;
    const key = head.dataset.month;
    if(openMonths.has(key)) openMonths.delete(key); else openMonths.add(key);
    renderMonthly();
  });

  async function deleteRecord(id){
    records = records.filter(r => r.id !== id);
    await persist();
    renderAll();
  }
  historyList.addEventListener('click', (e)=>{
    const btn = e.target.closest('.entry-del');
    if(btn) deleteRecord(Number(btn.dataset.id));
  });
  monthlyList.addEventListener('click', (e)=>{
    const btn = e.target.closest('.entry-del');
    if(btn) deleteRecord(Number(btn.dataset.id));
  });

  // ---------- image capture ----------
  let currentBase64 = null, currentMediaType = null;

  fileInput.addEventListener('change', (e)=>{ if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]); });
  // Android Chrome / PWAでタップが反応しない場合に備え、カード自体を明示的にファイル選択へ接続
  dropzone.addEventListener('click', (e)=>{
    if(e.target !== fileInput) fileInput.click();
  });
  ['dragover','dragenter'].forEach(evt=> dropzone.addEventListener(evt, e=>{ e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt=> dropzone.addEventListener(evt, e=>{ e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });

  document.addEventListener('paste', (e)=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        const file = item.getAsFile();
        if(file) handleFile(file);
        break;
      }
    }
  });

  function handleFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      currentBase64 = dataUrl.split(',')[1];
      currentMediaType = file.type || 'image/png';
      previewImg.src = dataUrl;
      dropzone.style.display = 'none';
      previewArea.style.display = 'block';
      confirmBlock.classList.remove('show');
      errorTag.style.display = 'none';
      analyzeImage();
    };
    reader.readAsDataURL(file);
  }

  ocrRetryBtn && ocrRetryBtn.addEventListener('click', analyzeImage);
  clearBtn.addEventListener('click', resetCapture);
  cancelBtn.addEventListener('click', resetCapture);
  function resetCapture(){
    currentBase64 = null; currentMediaType = null; fileInput.value = '';
    previewArea.style.display = 'none'; dropzone.style.display = 'block';
    confirmBlock.classList.remove('show'); errorTag.style.display = 'none'; scanLine.style.display = 'none';
    moreToggle.classList.remove('open'); moreFields.classList.remove('show');
  }

  async function analyzeImage(){
    analyzingTag.style.display='flex'; scanLine.style.display='block';
    errorTag.style.display='none'; confirmBlock.classList.remove('show');
    analyzingTag.innerHTML = '<span class="spinner"></span>OCRエンジンを準備中…';

    let worker = null;
    try{
      if(!window.Tesseract || typeof Tesseract.createWorker !== 'function') throw new Error('OCRライブラリを読み込めませんでした');
      worker = await Promise.race([
        Tesseract.createWorker('jpn+eng', 1, {
          workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
          langPath: 'https://tessdata.projectnaptha.com/4.0.0',
          corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0',
          logger: m => {
            if(m && m.status === 'recognizing text' && typeof m.progress === 'number')
              analyzingTag.innerHTML = `<span class="spinner"></span>画像を読み取り中… ${Math.round(m.progress*100)}%`;
            else if(m && m.status) analyzingTag.innerHTML = `<span class="spinner"></span>${m.status}`;
          }
        }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('OCRエンジンの読み込みがタイムアウトしました')), 45000))
      ]);

      const img = new Image();
      await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src=previewImg.src; });

      // Upscale without cropping. A little more resolution helps small punctuation.
      const scale = Math.min(4, Math.max(2.2, 2600 / Math.max(img.width,1)));
      const makeCanvas = (mode) => {
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        const x=c.getContext('2d',{willReadFrequently:true});
        x.imageSmoothingEnabled=true; x.drawImage(img,0,0,c.width,c.height);
        if(mode==='threshold'){
          const d=x.getImageData(0,0,c.width,c.height);
          for(let i=0;i<d.data.length;i+=4){
            const y=0.299*d.data[i]+0.587*d.data[i+1]+0.114*d.data[i+2];
            const v=y>125?255:0; d.data[i]=d.data[i+1]=d.data[i+2]=v;
          }
          x.putImageData(d,0,0);
        } else if(mode==='contrast'){
          x.filter='contrast(1.35) brightness(1.05)';
          x.drawImage(img,0,0,c.width,c.height);
        }
        return c;
      };

      analyzingTag.innerHTML='<span class="spinner"></span>数字と項目名を確認中…';
      const passes=[];
      for(const mode of ['normal','contrast','threshold']){
        const r=await worker.recognize(makeCanvas(mode), {rotateAuto:true});
        passes.push(r);
      }
      await worker.terminate(); worker=null;

      const cleanText = passes.map(p=>p?.data?.text||'').join('\n')
        .replace(/[，、]/g, ',').replace(/[：]/g, ':')
        .replace(/[’‘′]/g,"'").replace(/[″”]/g,'"')
        .replace(/[‐‑–—]/g,'-');
      if(!cleanText.trim()) throw new Error('OCR結果が空でした');

      const num = s => Number(String(s).replace(/,/g,''));
      const norm = s => String(s||'').toLowerCase()
        .replace(/[，,]/g,'').replace(/[：:]/g,'').replace(/[\s\u3000]/g,'')
        .replace(/[’‘′]/g,"'").replace(/[″”]/g,'"');

      // --- Spatial OCR parser -------------------------------------------------
      // Tesseract sometimes reads a value correctly but associates it with the
      // wrong field when we parse the whole text as one regex. We therefore use
      // word bounding boxes: find a label first, then choose the closest numeric
      // value to the right/below that label. This is much safer for Strava-style
      // screenshots where distance/pace/HR/time/steps are stacked vertically.
      const wordSets = passes.map(p=>p?.data?.words||[]).filter(a=>a.length);
      const words=[];
      for(const set of wordSets){
        for(const w of set){
          const text=String(w.text||'').trim();
          if(!text) continue;
          const b=w.bbox||{};
          const x0=Number(b.x0)||0, y0=Number(b.y0)||0, x1=Number(b.x1)||x0, y1=Number(b.y1)||y0;
          const conf=Number(w.confidence);
          words.push({text,x:(x0+x1)/2,y:(y0+y1)/2,x0,y0,x1,y1,conf:Number.isFinite(conf)?conf:0});
        }
      }

      const labelGroups={
        distance:['距離','総距離','distance','kilometers','km'],
        pace:['平均ペース','ペース','pace','min/km','/km'],
        hr:['平均心拍数','心拍数','heart rate','heartrate','bpm'],
        duration:['時間','経過時間','time','duration'],
        steps:['歩数','総歩数','steps','step count']
      };
      const labelHit=(w, key)=>{
        const t=norm(w.text);
        return labelGroups[key].some(q=>t.includes(norm(q)) || norm(q).includes(t) && t.length>=2);
      };
      const labels={};
      for(const key of Object.keys(labelGroups)){
        labels[key]=words.filter(w=>labelHit(w,key));
      }

      const allText=cleanText;
      const nearbyWords=(key)=>{
        const ls=labels[key]; if(!ls.length) return [];
        const out=[];
        for(const l of ls){
          for(const w of words){
            if(w===l) continue;
            const dx=w.x-l.x, dy=w.y-l.y;
            // Values are normally to the right or below the label. Keep a
            // generous vertical window because OCR can split a visual row.
            if((dx>=-40 && dx<=1500 && Math.abs(dy)<=900) || (Math.abs(dx)<=1000 && dy>=-80 && dy<=1100)){
              const dist=Math.hypot(Math.max(0,dx), Math.max(0,dy))*0.7 + Math.abs(dy)*0.3;
              out.push({w,dist});
            }
          }
        }
        return out.sort((a,b)=>a.dist-b.dist).map(o=>o.w);
      };
      const extractNearby=(key, regex)=>{
        for(const w of nearbyWords(key)){
          const m=String(w.text).match(regex); if(m) return m[1]||m[0];
        }
        // Try the text of nearby words together; this catches 5'17" and 25:44
        // when punctuation was split into separate OCR tokens.
        const ns=nearbyWords(key).slice(0,12).map(w=>w.text).join(' ')
          .replace(/[’‘′]/g,"'").replace(/[″”]/g,'"');
        const m=ns.match(regex); return m?(m[1]||m[0]):null;
      };

      // First use spatially associated values.
      let distance=null, pace=null, heartRate=null, durationSec=null, steps=null;
      let dv=extractNearby('distance','(\d+(?:[\.,]\d+)?)');
      if(dv){ distance=num(dv.replace(',','.')); if(distance>100 && distance<10000) distance=distance/100; }
      let pv=extractNearby('pace','(\d{1,2})\s*[:\']\s*(\d{2})');
      if(pv){ const m=String(pv).match(/(\d{1,2})\s*[:\']\s*(\d{2})/); if(m) pace=`${m[1]}'${m[2]}"`; }
      let hv=extractNearby('hr','(\d{2,3})');
      if(hv){ const n=num(hv); if(n>=35 && n<=230) heartRate=n; }
      let tv=extractNearby('duration','(\d{1,2})\s*[:：]\s*(\d{2})(?!\d)');
      if(tv){ const m=String(tv).match(/(\d{1,2})\s*[:：]\s*(\d{2})/); if(m) durationSec=Number(m[1])*60+Number(m[2]); }
      let sv=extractNearby('steps','([\d,]{3,8})');
      if(sv){ const n=num(sv); if(n>=100 && n<=100000) steps=n; }

      // Strong fallbacks based on the user's running-card layout. These are
      // intentionally conservative so one bad OCR token cannot populate the
      // wrong field.
      if(distance==null){
        const ms=[...allText.matchAll(/(\d+\.\d+)\s*(?:km|ＫＭ|ｋｍ)/gi)].map(m=>num(m[1]));
        distance=ms.find(n=>n>0 && n<100) ?? null;
      }
      if(pace==null){
        const ms=[...allText.matchAll(/(\d{1,2})\s*[:']\s*(\d{2})\s*(?:"|”)?\s*(?:\/\s*km)?/gi)];
        const hit=ms.find(m=>Number(m[1])>=3 && Number(m[1])<=12 && Number(m[2])<60);
        if(hit) pace=`${hit[1]}'${hit[2]}"`;
      }
      if(heartRate==null){
        const m=allText.match(/(\d{2,3})\s*bpm/i); if(m) heartRate=num(m[1]);
      }
      if(durationSec==null){
        const ms=[...allText.matchAll(/(\d{1,2}):\s*(\d{2})/g)];
        const hit=ms.find(m=>Number(m[2])<60 && Number(m[1])<24);
        if(hit) durationSec=Number(hit[1])*60+Number(hit[2]);
      }
      if(steps==null){
        const ms=[...allText.matchAll(/([\d,]{3,8})/g)].map(m=>num(m[1])).filter(n=>n>=1000 && n<=100000);
        // Prefer a 4-digit step count over obviously smaller HR/time numbers.
        if(ms.length) steps=ms.find(n=>n>=2000) ?? ms[0];
      }

      // For this Strava-style card, these five fields are the primary record.
      // Do not silently invent missing values; leave them blank for correction.
      inDistance.value = distance!=null ? distance.toFixed(2) : '';
      inPace.value = pace ?? '';
      inHr.value = heartRate ?? '';
      inDuration.value = durationSec!=null ? secondsToDuration(durationSec) : '';
      inDate.value = todayStr();
      inCalories.value = '';
      inSteps.value = steps ?? '';
      inElevation.value = '';
      inAerobic.value=''; inAzm.value=''; inMemo.value='';
      confirmBlock.classList.add('show');
    }catch(err){
      console.error('RUNLOG OCR error:',err);
      errorTag.textContent='OCRの読み取りに失敗しました。ネット接続を確認して「もう一度OCRする」を押してください。';
      if(ocrRetryBtn) ocrRetryBtn.style.display='block';
      errorTag.style.display='block';
      [inDistance,inPace,inHr,inDuration,inCalories,inSteps,inElevation,inAerobic,inAzm,inMemo].forEach(el=>el.value='');
      inDate.value=todayStr(); confirmBlock.classList.add('show');
    }finally{
      if(worker){try{await worker.terminate();}catch(e){}}
      analyzingTag.style.display='none'; scanLine.style.display='none';
      if(ocrRetryBtn) ocrRetryBtn.style.display='none';
    }
  }

  saveBtn.addEventListener('click', async ()=>{
    const rec = {
      id: Date.now(),
      date: inDate.value || todayStr(),
      distance: inDistance.value !== '' ? parseFloat(inDistance.value) : null,
      pace: inPace.value.trim() || null,
      heartRate: inHr.value !== '' ? parseInt(inHr.value,10) : null,
      durationSec: durationToSeconds(inDuration.value),
      calories: inCalories.value !== '' ? parseInt(inCalories.value,10) : null,
      steps: inSteps.value !== '' ? parseInt(inSteps.value,10) : null,
      elevationGain: inElevation.value !== '' ? parseInt(inElevation.value,10) : null,
      aerobicLoad: inAerobic.value !== '' ? parseFloat(inAerobic.value) : null,
      activeZoneMin: inAzm.value !== '' ? parseInt(inAzm.value,10) : null,
      memo: inMemo.value.trim() || null
    };
    records.push(rec);
    await persist();
    renderAll();
    resetCapture();
  });

  // init
  inDate.value = todayStr();
  loadRecords();
})();
</script>
</body>
</html>
